name: Check source
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    portable:
        runs-on: ubuntu-24.04
        env:
            UV_PROJECT_ENVIRONMENT: .build/python
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '26'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      host/bridge/package-lock.json
            - uses: actions/setup-python@v5
              with:
                  python-version-file: .python-version
            - uses: astral-sh/setup-uv@v10.3.0
              with:
                  version: '0.13.0'
                  enable-cache: true
            - run: npm ci
            - run: npm ci --prefix host/bridge
            - run: uv sync --locked --only-group format
            - run: make check-format test check-js check-python check-public CLANG_FORMAT=clang-format-18
